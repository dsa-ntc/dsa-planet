name: Jekyll Feed Tests

on:
  pull_request:
    paths: &trigger_paths
      - .github/workflows/feeds.yml
      - Gemfile
      - Gemfile.lock
      - hackergotchi/*
      - planet.ini
      - bin/feed_check*.rb
    branches: &trigger_branches
      - master
  push:
    paths: *trigger_paths
    branches: *trigger_branches
  schedule:
      - cron:  0 9 * * 1
  workflow_dispatch:

permissions: read-all

concurrency:
  group: >-
    ${{ github.workflow }}
    -${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feed-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: 4.0
          bundler-cache: true

      - run: bundle exec ruby bin/feed_check.rb

      - if: failure()
        run: cat error-summary.md >> $GITHUB_STEP_SUMMARY
